services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aliya
      POSTGRES_DB: rescuebite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"

 backend:

    build: ./backend

    container_name: rescuebite-backend

    restart: always

    depends_on:

      - postgres

      - redis

    ports:

      - "3000:3000"

    environment:

      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rescuebite

      REDIS_URL: redis://redis:6379

      JWT_SECRET: your_jwt_secret

      JWT_REFRESH_SECRET: your_refresh_secret

      EMAIL_API_KEY: your_email_key

      EMAIL_FROM: test@test.com

    command: sh -c "npx prisma migrate deploy && npm start"



  worker:

    build: ./backend

    container_name: rescuebite-worker

    depends_on:

      - redis

      - postgres

    environment:

      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rescuebite

      REDIS_URL: redis://redis:6379

    command: npm run worker



  frontend:

    build: ./frontend

    container_name: rescuebite-frontend

    restart: always

    depends_on:

      - backend

    ports:

      - "5173:5173"




volumes:
  pgdata:
  version: "3.9"
